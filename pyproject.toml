[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

# Application import path is `backend.*` (see CLAUDE.md). The project name is clipapp
# but the installable package directory is `backend/`. This makes `uv sync` / editable
# installs put `backend` on sys.path so scripts and tests can import it without PYTHONPATH hacks.
[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "clipapp"
version = "0.1.0"
description = "Twitch clip discovery and ranking platform with swipe-to-vote UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.0",
    "moviepy>=2.2.1",
    "numpy>=2.4.3",
    "requests>=2.32.5",
    "tiktok-uploader>=1.2.0",
    "yt-dlp>=2026.3.17",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.13.1",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
]

[tool.basedpyright]
# Root on sys.path for `backend.*` imports; pin venv so the language server resolves site-packages.
extraPaths = ["."]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22.1",
]

[tool.ruff.lint]
# E402: dotenv must load before app imports (Alembic, one-off scripts).
# E701/E702/E722: backend/engine.py is immutable legacy style per CLAUDE.md.

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"backend/engine.py" = ["E701", "E702", "E722", "F401", "F841"]
"scripts/db_setup/create_tables.py" = ["E402"]
